# 只为 Let's Encrypt 的 HTTP-01 验证和「http → https」跳转准备的 80 端口。
# 证书签下来之后，业务仍然走 443，这个块只做重定向 + 放验证文件。
#
# 模板：本文件由 deploy/setup-https.sh 拷贝到
#       /etc/nginx/sites-available/dashboard-http.conf
# 占位符：无（不需要替换）

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    charset utf-8;
    client_max_body_size 20m;

    # ACME 验证：certbot --webroot 会把挑战文件写到这里
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 其余一律跳 https
    location / {
        return 302 https://$host$request_uri;
    }
}
