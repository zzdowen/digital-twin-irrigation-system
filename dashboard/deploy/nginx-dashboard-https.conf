# 看板 · HTTPS 站点（Let's Encrypt IP 证书）
#
# 模板：本文件由 deploy/setup-https.sh 渲染后写到
#       /etc/nginx/sites-available/dashboard-https.conf
# 占位符（由脚本 sed 替换）：
#   __CERT_NAME__  → 证书名，等于服务器公网 IP，对应 /etc/letsencrypt/live/<它>/
#   __APP_PORT__   → 后端监听端口，默认 8000
#
# 因为证书是签给 IP 的，所有请求必须用 https://<公网IP>/ 访问。

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # 会话票据关掉，减少「一次泄露长期可用」的面
    ssl_session_tickets off;

    # OCSP stapling（IP 证书没有 OCSP 地址时会 warn，无害）
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.53 valid=300s;
    resolver_timeout 5s;

    charset utf-8;
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 安全响应头（后端也会加，这里对静态资源做兜底）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # ACME 验证（续期主要走 80；这里也留一份以防挑战走 443）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 后端整站反代：/chat /api/ /files/ /health / 全在一个端口
    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        # 不要把上游的 Server 头带出去
        proxy_hide_header Server;
    }
}
